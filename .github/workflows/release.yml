name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust (with both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies (with retry + verify)
        run: |
          # Workaround for npm/cli #7672 — `npm ci` sometimes prints
          # "Exit handler never called!" and exits 0 *without installing
          # anything*. Detect that by checking that bin shims exist;
          # retry up to 3 times before failing the build loudly.
          set +e
          for attempt in 1 2 3; do
            echo "::group::npm ci attempt $attempt"
            rm -rf node_modules
            npm ci
            npm rebuild
            echo "::endgroup::"
            if [ -x node_modules/.bin/tsc ] \
               && [ -x node_modules/.bin/vite ] \
               && [ -x node_modules/.bin/tauri ]; then
              echo "✓ install verified on attempt $attempt"
              ls node_modules/.bin | head -25
              exit 0
            fi
            echo "✗ install incomplete on attempt $attempt — bin shims missing; retrying"
            sleep 5
          done
          echo "::error::npm ci silently failed 3 times. See npm/cli #7672."
          exit 1

      - name: Install Tauri CLI globally (CI fallback)
        run: |
          # node_modules/.bin/tauri sometimes isn't created on the GitHub
          # macOS runner after `npm ci`; installing globally puts the CLI
          # on PATH explicitly so `npx tauri` always resolves.
          npm install -g @tauri-apps/cli@^2
          which tauri
          tauri --version

      - name: Build and release wyde.app (universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Skip the action's `npm run tauri --` default; the npm-script
          # path is brittle in CI (the local `tauri` shim sometimes isn't
          # present after `npm ci`). With our global install step above,
          # `tauri` is already on PATH — invoke it directly.
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: "wyde ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            Download `wyde_*_universal.dmg` below.

            1. Open the `.dmg` and drag **wyde** to `/Applications`.
            2. **First launch:** right-click `wyde` → **Open** to dismiss the
               unsigned-developer Gatekeeper warning. Subsequent launches
               are normal double-clicks.

            See the README for details.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
