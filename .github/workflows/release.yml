name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from package.json's `packageManager` field — keep
        # only one source of truth.
        uses: pnpm/action-setup@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (with both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests (fail fast before the slow Rust compile)
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build and release wyde.app (universal)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "wyde ${{ github.ref_name }}"
          releaseBody: |
            ## Install

            Download `wyde_*_universal.dmg` below.

            1. Open the `.dmg` and drag **wyde** to `/Applications`.
            2. Double-click **wyde**. macOS blocks it ("Apple cannot
               check it for malicious software") because the build is
               unsigned — click **Done**.
            3. Open **System Settings → Privacy & Security**, scroll
               to the **Security** section, click **Open Anyway**.
            4. Double-click **wyde** again, then **Open** in the final
               dialog.

            Subsequent launches are normal double-clicks. Power users
            can skip the Settings step with
            `xattr -dr com.apple.quarantine /Applications/wyde.app`.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
