[package]
name = "wyde"
version = "1.1.0"
description = "Native macOS markdown viewer focused on wide tables"
authors = ["wyde contributors"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wyde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2.5.0", features = ["watch"] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.3"
